name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Run tests with coverage
        run: pnpm test -- --coverage

      - name: Merge coverage reports
        run: node scripts/coverage-merge.js

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: .coverage/
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const coveragePath = '.coverage/lcov.info';
            
            if (fs.existsSync(coveragePath)) {
              const content = fs.readFileSync(coveragePath, 'utf-8');
              const lines = content.split('\n');
              let totalLines = 0;
              let coveredLines = 0;
              
              for (const line of lines) {
                if (line.startsWith('LH:')) {
                  coveredLines += parseInt(line.substring(3));
                } else if (line.startsWith('LF:')) {
                  totalLines += parseInt(line.substring(3));
                }
              }
              
              const coverage = totalLines > 0 ? ((coveredLines / totalLines) * 100).toFixed(2) : 0;
              
              const comment = `## Coverage Report\n\n- **Lines**: ${coveredLines}/${totalLines} (${coverage}%)\n\nFull coverage reports available in artifacts.`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment,
              });
            }
